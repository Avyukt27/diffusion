name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-native:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux (AMD64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: diffusion
            artifact_name: release-artifact-linux
            rustflags: ""

          - name: Windows (AMD64)
            os: windows-latest
            target: x86_64-pc-windows-gnu
            bin_name: diffusion.exe
            artifact_name: release-artifact-windows
            rustflags: "-C link-arg=-Wl,--exclude-all-symbols"

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build Target
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        run: cargo build --target ${{ matrix.platform.target }} --release --verbose

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin_name }}

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WebAssembly Target
        run: wasm-pack build --target web --out-dir web/pkg

      - name: Stage Public Static Folder
        run: |
          mkdir -p dist
          if [ ! -f web/index.html ]; then
            echo "ERROR: index.html missing from web dir!"
            exit 1
          fi
          cp web/index.html dist/
          if [ -f web/favicon.png ]; then
            cp web/favicon.png dist/
          fi
          cp -r web/pkg dist/
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: release-artifact-wasm
          path: ./dist

  deploy-pages:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Asset
        uses: actions/download-artifact@v4
        with:
          name: release-artifact-linux
          path: ./artifacts/linux

      - name: Download Windows Asset
        uses: actions/download-artifact@v4
        with:
          name: release-artifact-windows
          path: ./artifacts/windows

      - name: Rename Binaries for Release
        run: |
          mv ./artifacts/linux/diffusion ./artifacts/linux/diffusion-linux-amd64
          mv ./artifacts/windows/diffusion.exe ./artifacts/windows/diffusion-windows-amd64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/linux/diffusion-linux-amd64
            ./artifacts/windows/diffusion-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
